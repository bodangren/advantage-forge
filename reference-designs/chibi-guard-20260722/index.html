<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chibi Quest guard reference candidates</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #121018; color: #f7f2ff; }
    body { margin: 0; padding: 24px; }
    h1 { margin: 0 0 8px; }
    .notice { max-width: 80ch; color: #d8cfdf; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
    figure { margin: 0; padding: 12px; border: 2px solid #51495d; border-radius: 12px; background: #1b1722; }
    figure.selected { border-color: #72e59a; }
    figure.secondary { border-color: #68b8ff; }
    figure.rejected { opacity: .78; }
    img { display: block; width: 100%; height: auto; background: #ff00ff; image-rendering: auto; }
    figcaption { padding-top: 10px; line-height: 1.4; }
    strong { display: block; font-size: 1.05rem; }
    .selected strong { color: #72e59a; }
    .secondary strong { color: #68b8ff; }
    .rejected strong { color: #ff8c8c; }
  </style>
</head>
<body>
  <h1>Chibi Quest guard reference candidates</h1>
  <p class="notice">Non-shipping generated design evidence. Selection here chooses a structural modeling target only; it does not accept a Forge model, sprite, animation, or theme-pack asset.</p>
  <main class="grid">
    <figure class="secondary"><img src="chibi-guard-base-turnaround_001.jpg" alt="Base candidate 001"><figcaption><strong>Secondary art direction</strong>Strong personality and chibi proportions; views are too three-quarter-oriented for structural truth.</figcaption></figure>
    <figure class="selected"><img src="chibi-guard-base-turnaround_002.jpg" alt="Base candidate 002"><figcaption><strong>Selected structural target</strong>Best consistent front, side, and back coverage; simple geometry and no held-equipment drift.</figcaption></figure>
    <figure class="rejected"><img src="chibi-guard-base-turnaround_003.jpg" alt="Base candidate 003"><figcaption><strong>Rejected</strong>Generated logo/text and incomplete orthographic coverage.</figcaption></figure>
    <figure class="rejected"><img src="chibi-guard-base-turnaround_004.jpg" alt="Base candidate 004"><figcaption><strong>Rejected</strong>Accidental shield carryover and no true front view.</figcaption></figure>
    <figure class="rejected"><img src="chibi-guard-turnaround_001.jpg" alt="Equipped candidate 001"><figcaption><strong>Rejected equipped batch</strong>Useful style evidence, but equipment and view coverage are inconsistent.</figcaption></figure>
    <figure class="rejected"><img src="chibi-guard-turnaround_002.jpg" alt="Equipped candidate 002"><figcaption><strong>Rejected equipped batch</strong>Repeated front view and equipment drift.</figcaption></figure>
    <figure class="rejected"><img src="chibi-guard-turnaround_003.jpg" alt="Equipped candidate 003"><figcaption><strong>Rejected equipped batch</strong>Repeated front view and weapon/shield drift.</figcaption></figure>
    <figure class="rejected"><img src="chibi-guard-turnaround_004.jpg" alt="Equipped candidate 004"><figcaption><strong>Rejected equipped batch</strong>Clear equipment but insufficiently chibi and inconsistent loadout across views.</figcaption></figure>
  </main>
</body>
</html>
