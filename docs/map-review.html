<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Review</title><style>
:root{--bg:#f6f5f1;--fg:#222;--card:#fff;--line:#d8d5cc;--ok:#1f7a3d;--no:#b3261e;--mut:#6b6860}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#e8e6e0;--card:#222220;--line:#3a3935;--ok:#5fc582;--no:#ff8a80;--mut:#9a978e}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}button,select{font:inherit;padding:4px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.card.accept{border-color:var(--ok);border-width:2px}.card.reject{border-color:var(--no);border-width:2px}
.card h2{margin:0 0 4px;font-size:17px}.meta{color:var(--mut);font-size:13px;margin-bottom:8px}
.imgs{display:grid;grid-template-columns:2fr 1fr;gap:6px}.imgs img{width:100%;border-radius:6px;display:block;cursor:zoom-in;background:#000}
.imgs .stack{display:grid;gap:6px;align-content:start}.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.row button{flex:0 0 auto}.a.on{background:var(--ok);color:#fff}.r.on{background:var(--no);color:#fff}
input.note{flex:1;min-width:0;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#zoom{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:10}#zoom img{max-width:96vw;max-height:96vh}
.tag{display:inline-block;padding:0 6px;border-radius:4px;border:1px solid var(--line);font-size:12px}
</style></head><body>
<header><h1>Map review</h1><span id="count"></span>
<select id="filter"><option value="all">All maps</option><option value="undecided">Undecided</option><option value="accept">Accepted</option><option value="reject">Rejected</option><option value="reserve">Reserve (agent)</option><option value="unviewed">Not viewed by orchestrator</option></select>
<button id="export">Export JSON</button><button id="copy">Copy TSV</button></header>
<main id="grid"></main><div id="zoom"><img alt=""></div>
<script>
const MAPS=[{"id":"abandoned-fort","rating":"6.5","status":"reserve","note":"after 1 feedback; broken-wall colour mismatch","pieces":"","reviewed":false},{"id":"alchemy-lab","rating":"7.0","status":"pass","note":"agent 6.5, orchestrator 7.0","pieces":"","reviewed":false},{"id":"ancient-ruin","rating":"7.0","status":"pass","note":"after 1 feedback; not re-viewed by orchestrator","pieces":"287","reviewed":true},{"id":"apothecary","rating":"7.0","status":"pass","note":"not re-viewed by orchestrator","pieces":"","reviewed":true},{"id":"arcane-sanctum","rating":"7.0","status":"pass","note":"","pieces":"","reviewed":false},{"id":"arena","rating":"6.5","status":"reserve","note":"after 2 passes; plaster-wall reads dark, jagged edge","pieces":"","reviewed":false},{"id":"armory","rating":"7.0","status":"pass","note":"shots predate one workbench move","pieces":"","reviewed":false},{"id":"bakery","rating":"7.0","status":"pass","note":"after 1 feedback; 115 pieces; not re-viewed by orchestrator","pieces":"","reviewed":true},{"id":"bandit-camp","rating":"7.0","status":"pass","note":"","pieces":"","reviewed":false},{"id":"barracks","rating":"7.0","status":"pass","note":"not re-viewed by orchestrator","pieces":"","reviewed":true},{"id":"boss-arena","rating":"7.0","status":"pass","note":"after 1 feedback; no towers on wall","pieces":"","reviewed":false},{"id":"bridge","rating":"7.0","status":"pass","note":"after 1 feedback; wooden bridge","pieces":"","reviewed":false},{"id":"canyon","rating":"6.5","status":"reserve","note":"below bar; needs red-rock cliff piece and dry-riverbed tile","pieces":"","reviewed":false},{"id":"castle","rating":"7.0","status":"pass","note":"after 1 feedback; longhouse roof covers throne corner","pieces":"227","reviewed":false},{"id":"catacombs","rating":"7.0","status":"pass","note":"after 1 feedback","pieces":"","reviewed":false},{"id":"cathedral","rating":"6.5","status":"reserve","note":"below bar; plaster walls, thin pews; no feedback pass (goal met)","pieces":"","reviewed":false},{"id":"cemetery","rating":"7.0","status":"pass","note":"after 1 feedback; dark chapels","pieces":"","reviewed":false},{"id":"clearing","rating":"7.0","status":"pass","note":"after 1 feedback; orchestrator viewed 3q","pieces":"","reviewed":false},{"id":"coast","rating":"5.5","status":"reserve","note":"no solid sea tile; water maps blocked (harbor, lighthouse replaced)","pieces":"","reviewed":false},{"id":"crypt","rating":"7.0","status":"pass","note":"missing iron-gate, cobweb","pieces":"","reviewed":false},{"id":"crystal-cave","rating":"6.0","status":"reserve","note":"after 1 feedback: empty floor, green mat under cave-mouth is part of the asset; needs an asset fix","pieces":"","reviewed":false},{"id":"desert-oasis","rating":"7.0","status":"pass","note":"Castle Defense; after 1 feedback; heavy brown trail","pieces":"","reviewed":false},{"id":"forest-village","rating":"7.0","status":"pass","note":"not re-viewed by orchestrator","pieces":"","reviewed":true},{"id":"fortress","rating":"7.0","status":"pass","note":"not re-viewed by orchestrator","pieces":"","reviewed":true},{"id":"gatehouse","rating":"7.0","status":"pass","note":"after 1 feedback; bright grass","pieces":"","reviewed":false},{"id":"general-store","rating":"7.0","status":"pass","note":"after 1 feedback; not re-viewed by orchestrator","pieces":"","reviewed":true},{"id":"goblin-camp","rating":"7.0","status":"pass","note":"missing totem, weapon-rack","pieces":"","reviewed":false},{"id":"grassland","rating":"7.0","status":"pass","note":"Castle Defense level 1 road","pieces":"166","reviewed":false},{"id":"grove","rating":"7.2","status":"pass","note":"after 1 feedback; orchestrator viewed 3q","pieces":"","reviewed":false},{"id":"guild-hall","rating":"7.0","status":"pass","note":"","pieces":"","reviewed":false},{"id":"ice-cave","rating":"7.0","status":"pass","note":"after 1 feedback; no cyan water","pieces":"","reviewed":false},{"id":"inn","rating":"7.0","status":"pass","note":"missing hanging lantern","pieces":"","reviewed":false},{"id":"labyrinth","rating":"7.0","status":"pass","note":"hedges thin; fits Labyrinth Goblin King stage","pieces":"","reviewed":false},{"id":"lava-cave","rating":"5.0","status":"reserve","note":"no glowing lava tile or obsidian spike; volcanic-field has the same risk","pieces":"","reviewed":false},{"id":"library","rating":"6.5","status":"feedback","note":"bare wood floor, loose tomes","pieces":"","reviewed":false},{"id":"market-square","rating":"7.0","status":"pass","note":"agent 6.5, orchestrator 7.0; palette differs from mockup","pieces":"","reviewed":false},{"id":"marsh","rating":"7.0","status":"pass","note":"after 1 feedback; orchestrator viewed 3q","pieces":"","reviewed":false},{"id":"mausoleum","rating":"7.0","status":"pass","note":"after 1 feedback; not re-viewed by orchestrator","pieces":"158","reviewed":true},{"id":"meadow","rating":"7.2","status":"pass","note":"after 1 feedback; orchestrator viewed 3q","pieces":"236","reviewed":false},{"id":"mine","rating":"7.0","status":"pass","note":"after 1 feedback; plain floor centre","pieces":"","reviewed":false},{"id":"monastery","rating":"7.0","status":"pass","note":"mockup generated after build; chapel and tower are stand-ins","pieces":"169","reviewed":false},{"id":"mountain-pass","rating":"7.0","status":"pass","note":"Castle Defense level 3; after 1 feedback; path blocky","pieces":"","reviewed":false},{"id":"observatory","rating":"7.0","status":"pass","note":"agent 6.8; flat telescope","pieces":"","reviewed":false},{"id":"orc-camp","rating":"7.0","status":"pass","note":"bright roof; light mood","pieces":"","reviewed":false},{"id":"portal-chamber","rating":"7.0","status":"pass","note":"agent 6.8, orchestrator 7.0; floor a bit sparse","pieces":"","reviewed":false},{"id":"prison","rating":"7.0","status":"pass","note":"no feedback pass; orchestrator viewed 3q","pieces":"166","reviewed":false},{"id":"quarry","rating":"6.5","status":"reserve","note":"after 1 feedback; low flat terraces","pieces":"315","reviewed":false},{"id":"school","rating":"7.0","status":"pass","note":"not re-viewed by orchestrator","pieces":"","reviewed":true},{"id":"shrine","rating":"7.0","status":"pass","note":"","pieces":"240","reviewed":false},{"id":"stable","rating":"7.0","status":"pass","note":"orchestrator rated 7.0 (agent 6.8); clear stable, dirt ground bare","pieces":"","reviewed":false},{"id":"swamp","rating":"7.0","status":"pass","note":"Castle Defense level 5 path; missing stilt-hut","pieces":"","reviewed":false},{"id":"temple","rating":"7.0","status":"pass","note":"","pieces":"","reviewed":false},{"id":"throne-room","rating":"7.0","status":"pass","note":"after 1 feedback; dark stone palette","pieces":"","reviewed":false},{"id":"tomb","rating":"7.0","status":"pass","note":"after 1 feedback; heavy sand frame","pieces":"","reviewed":false},{"id":"town","rating":"7.0","status":"pass","note":"after 1 feedback","pieces":"","reviewed":false},{"id":"treasure-vault","rating":"7.0","status":"pass","note":"","pieces":"","reviewed":false},{"id":"tundra","rating":"7.0","status":"pass","note":"Castle Defense; after 1 feedback; flat slab","pieces":"","reviewed":false},{"id":"warehouse","rating":"7.0","status":"pass","note":"","pieces":"","reviewed":false},{"id":"watchtower","rating":"6.8","status":"reserve","note":"below bar after 1 feedback; flat ground, sparse dressing","pieces":"","reviewed":false},{"id":"witch-hut","rating":"6.5","status":"reserve","note":"after 1 feedback","pieces":"214","reviewed":false},{"id":"wizard-tower","rating":"7.0","status":"pass","note":"ritual circle repeats arcane-sanctum","pieces":"","reviewed":false}];
const KEY='map-review-v1';let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const grid=document.getElementById('grid'),zoom=document.getElementById('zoom');
function render(){const f=document.getElementById('filter').value;grid.innerHTML='';let n=0,a=0,r=0;
for(const m of MAPS){const s=S[m.id]||{};if(s.d==='accept')a++;if(s.d==='reject')r++;
if(f==='undecided'&&s.d)continue;if((f==='accept'||f==='reject')&&s.d!==f)continue;if(f==='reserve'&&m.status!=='reserve')continue;if(f==='unviewed'&&!m.reviewed)continue;n++;
const c=document.createElement('div');c.className='card '+(s.d||'');
c.innerHTML='<h2>'+m.id+'</h2><div class="meta">Agent rating '+(m.rating||'?')+' · '+(m.status||'no log')+(m.pieces?' · '+m.pieces+' pieces':'')+(m.reviewed?' · <span class="tag">not viewed</span>':'')+'</div>'+
'<div class="imgs"><img loading="lazy" src="map-mockups/'+m.id+'-3q.png" alt="'+m.id+' 3/4 view"><div class="stack"><img loading="lazy" src="map-mockups/'+m.id+'-top.png" alt="top view"><img loading="lazy" src="map-mockups/'+m.id+'.jpg" alt="mockup"></div></div>'+
'<div class="row"><button class="a'+(s.d==='accept'?' on':'')+'">Accept</button><button class="r'+(s.d==='reject'?' on':'')+'">Reject</button><input class="note" placeholder="Note" value="'+(s.n||'').replace(/"/g,'&quot;')+'"></div>';
const set=(d)=>{S[m.id]=Object.assign(S[m.id]||{},{d:S[m.id]&&S[m.id].d===d?'':d});save();render()};
c.querySelector('.a').onclick=()=>set('accept');c.querySelector('.r').onclick=()=>set('reject');
c.querySelector('.note').onchange=(e)=>{S[m.id]=Object.assign(S[m.id]||{},{n:e.target.value});save()};
c.querySelectorAll('img').forEach(i=>i.onclick=()=>{zoom.firstChild.src=i.src;zoom.style.display='flex'});grid.appendChild(c)}
document.getElementById('count').textContent=n+' shown · '+a+' accepted · '+r+' rejected · '+(MAPS.length-a-r)+' undecided'}
zoom.onclick=()=>zoom.style.display='none';document.getElementById('filter').onchange=render;
const rows=()=>MAPS.map(m=>{const s=S[m.id]||{};return{map:m.id,decision:s.d||'',note:s.n||'',agentRating:m.rating}});
document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(rows(),null,2)],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='map-review.json';u.click()};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(rows().map(r=>[r.map,r.decision,r.note].join('\t')).join('\n'));
render();
</script></body></html>
